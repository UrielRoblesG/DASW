<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pseudoclases UI</title>
    <style>
      button {
        background-color: #667eea;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      input {
        padding: 8px;
        border: 2px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        margin: 10px 0;
      }
      a {
        color: #667eea;
        text-decoration: none;
      }
      /* Estiliza botones con: - Hover: cambiar color y sombra - Active: efecto presionado - Inputs con focus: borde azul - Inputs deshabilitados: gris */
    </style>
  </head>
  <body>
    <h1>Estados de Interacción</h1>
    <button>Botón Normal</button> <button disabled>Botón Deshabilitado</button>
    <input type="text" placeholder="Ingresa algo" />
    <input type="email" placeholder="Email" />
    <input type="text" disabled placeholder="Deshabilitado" />
    <a href="#">Enlace de prueba</a>
  </body>
</html>
