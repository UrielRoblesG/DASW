<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Selectores de Atributos</title>
    <style>
      /* 
      Colores
      Verde:  #27ae60; 
      Rojo::after #e74c3c
      Gris: #ecf0f1*/
      /* Escribe selectores para: 1. Enlaces que empiezan con https 2. Inputs de tipo email 3. Enlaces que terminan con .pdf 4. Inputs deshabilitados 5. Elementos con data-importante */
    </style>
  </head>
  <body>
    <h1>Enlaces y Formularios</h1>
    <!-- Enlaces -->
    <a href="https://google.com">Google (HTTPS)</a>
    <a href="http://ejemplo.com">Ejemplo (HTTP)</a>
    <a href="documento.pdf">Descargar PDF</a>
    <a href="imagen.jpg">Ver Imagen</a>
    <!-- Formulario -->
    <form>
      <input type="email" placeholder="Tu email" />
      <input type="text" placeholder="Tu nombre" />
      <input type="email" disabled placeholder="Email deshabilitado" />
      <input type="password" placeholder="Contraseña" />
    </form>
    <!-- Elementos con data -->
    <div data-importante="si">Elemento importante</div>
    <div>Elemento normal</div>
  </body>
</html>
