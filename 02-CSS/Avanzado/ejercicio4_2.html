<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pseudoclase :not()</title>
    <style>
      /* Estiliza todos los párrafos EXCEPTO el que tiene clase "advertencia" */
    </style>
  </head>
  <body>
    <h1>Artículos</h1>
    <article>
      <p>Párrafo normal 1</p>
      <p class="advertencia">⚠️ Este es una advertencia</p>
      <p>Párrafo normal 2</p>
    </article>
    <article>
      <p>Párrafo normal 3</p>
      <p class="advertencia">⚠️ Otra advertencia</p>
    </article>
  </body>
</html>
